site_name: Lab Infrastructure Registry
theme:
  name: material
  features:
    - content.code.copy

validation:
  anchors: warn

# The documentation before November 2026: kept in the repository, not on the site
exclude_docs: |
  archive/

nav:
  - Home: index.md
  - Our servers: servers.md
  - Setting up a server: server-setup.md
  - University VMs: vm.md
  - Docker Compose: docker.md
  - Apps: apps.md
  - FAQ: faq.md
  - Software development:
      - Our software: software.md
      - Authentication standard: auth.md
      - Authentication provider: auth-install.md
      - Migration guide: auth-migration.md
      - AmCAT: amcat.md
      - AnnoTinder: annotinder.md
  - Policies:
      - Privacy statement: policies/privacy.md
      - Acceptable use policy: policies/aup.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
